name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.12"
          - "3.11"
          - "3.10"
        django-version:
          - "5.0"
          - "4.2"
        import-export:
          - ""
          - "-importexport"
    name: Python ${{ matrix.python-version }} & Django ${{ matrix.django-version }}${{ matrix.import-export }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v6
    - run: uv run tox -e py${{ matrix.python-version }}-django${{ matrix.django-version }}${{ matrix.import-export }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v6
    - run: uv run tox -e typecheck

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - run: pip install -r docs/requirements.txt
    - run: sphinx-build -W --keep-going -b html docs docs/_build
