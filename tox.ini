[tox]
isolated_build = True

envlist =
    py{3.10,3.11,3.12,3.13}-django4.2
    py{3.10,3.11,3.12,3.13}-django5.0

[testenv]
setenv =
    PYTHONPATH={toxinidir}
deps =
    django4.2: Django>=4.2,<5.0
    django5.0: Django>=5.0,<6.0
    pytest
    pytest-ruff
    django-import-export
commands =
    pytest
