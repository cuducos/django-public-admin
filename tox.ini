[tox]
isolated_build = True
requires =
    tox>=4.18
    tox-uv>=1

envlist =
    py{3.11,3.12,3.13,3.14}-django5.2{,-importexport}
    py{3.12,3.13,3.14}-django6.0{,-importexport}
    py{3.12,3.13,3.14,3.15}-django6.1{,-importexport}
    typecheck

[testenv]
setenv =
    PYTHONPATH={toxinidir}
deps =
    django5.2: Django>=5.2,<6.0
    django6.0: Django>=6.0,<6.1
    django6.1: Django>=6.1,<6.2
    importexport: django-import-export
    pytest
    pytest-ruff
commands =
    pytest

[testenv:typecheck]
setenv =
    PYTHONPATH={toxinidir}
deps =
    Django>=6.1,<6.2
    django-import-export
    pytest
    ty
commands =
    ty check --python {envpython}
